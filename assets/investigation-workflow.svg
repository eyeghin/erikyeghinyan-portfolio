<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">How I review a transaction monitoring alert</title>
<desc id="desc">A six step investigation workflow leading to closure or escalation</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7FAFB"/>
    <stop offset="1" stop-color="#EAF4F3"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0C2F40" flood-opacity=".13"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0l10 5l-10 5z" fill="#2A7D78"/>
  </marker>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<text x="70" y="65" fill="#0B2638" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">My Alert Review Process</text>
<text x="70" y="98" fill="#486571" font-family="Arial, Helvetica, sans-serif" font-size="17">A structured review based on customer context, transaction evidence, and clear documentation</text>

<g stroke="#2A7D78" stroke-width="4" fill="none" marker-end="url(#arrow)">
  <path d="M250 205H350"/>
  <path d="M570 205H670"/>
  <path d="M890 205H990"/>
  <path d="M1100 265V330H825"/>
  <path d="M1100 265V430H825"/>
</g>

<g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(70 140)">
    <rect width="180" height="130" rx="16" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="19" fill="#0B6E75"/><text x="32" y="39" text-anchor="middle" fill="#FFF" font-size="19" font-weight="700">1</text>
    <text x="24" y="78" fill="#0B2638" font-size="19" font-weight="700">Review Trigger</text>
    <text x="24" y="105" fill="#526B76" font-size="15">What generated</text><text x="24" y="124" fill="#526B76" font-size="15">the alert?</text>
  </g>
  <g transform="translate(350 140)">
    <rect width="220" height="130" rx="16" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="19" fill="#0B6E75"/><text x="32" y="39" text-anchor="middle" fill="#FFF" font-size="19" font-weight="700">2</text>
    <text x="24" y="78" fill="#0B2638" font-size="19" font-weight="700">Know the Customer</text>
    <text x="24" y="105" fill="#526B76" font-size="15">Profile, purpose, history,</text><text x="24" y="124" fill="#526B76" font-size="15">and expected activity</text>
  </g>
  <g transform="translate(670 140)">
    <rect width="220" height="130" rx="16" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="19" fill="#0B6E75"/><text x="32" y="39" text-anchor="middle" fill="#FFF" font-size="19" font-weight="700">3</text>
    <text x="24" y="78" fill="#0B2638" font-size="19" font-weight="700">Follow the Money</text>
    <text x="24" y="105" fill="#526B76" font-size="15">Timing, value, velocity,</text><text x="24" y="124" fill="#526B76" font-size="15">channels, counterparties</text>
  </g>
  <g transform="translate(990 140)">
    <rect width="140" height="130" rx="16" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="19" fill="#0B6E75"/><text x="32" y="39" text-anchor="middle" fill="#FFF" font-size="19" font-weight="700">4</text>
    <text x="24" y="78" fill="#0B2638" font-size="19" font-weight="700">Research</text>
    <text x="24" y="105" fill="#526B76" font-size="15">KYC, OSINT,</text><text x="24" y="124" fill="#526B76" font-size="15">adverse media</text>
  </g>
  <g transform="translate(590 310)">
    <rect width="235" height="90" rx="16" fill="#FFFFFF" stroke="#3AA98F" stroke-width="3"/>
    <circle cx="32" cy="30" r="19" fill="#3AA98F"/><text x="32" y="37" text-anchor="middle" fill="#FFF" font-size="19" font-weight="700">5A</text>
    <text x="64" y="31" fill="#0B2638" font-size="18" font-weight="700">Reasonably Explained</text>
    <text x="64" y="59" fill="#526B76" font-size="15">Document and close</text>
  </g>
  <g transform="translate(590 410)">
    <rect width="235" height="90" rx="16" fill="#FFFFFF" stroke="#C88C3A" stroke-width="3"/>
    <circle cx="32" cy="30" r="19" fill="#C88C3A"/><text x="32" y="37" text-anchor="middle" fill="#FFF" font-size="17" font-weight="700">5B</text>
    <text x="64" y="31" fill="#0B2638" font-size="18" font-weight="700">Risk Remains</text>
    <text x="64" y="59" fill="#526B76" font-size="15">Escalate with evidence</text>
  </g>
</g>
<text x="70" y="485" fill="#315663" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">The alert starts the review. The evidence determines the outcome.</text>
</svg>